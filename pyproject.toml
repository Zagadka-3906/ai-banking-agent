[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-banking-agent"
version = "2.0.0"
description = "安全可审计的银行 AI 智能体 Mock 沙箱"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.6",
  "requests==2.33.0",
  "langgraph==1.2.14",
  "langgraph-sdk==0.4.6",
  "langgraph-prebuilt==1.1.0",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-openai==1.1.14",
  "langchain-core==1.4.9",
  "cryptography==50.0.0",
  "python-dotenv==1.2.2",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==7.1.0", "httpx==0.28.1", "ruff>=0.6", "mypy==2.3.1"]
feishu = ["lark-oapi==1.7.3"]
optimization = ["gepa==0.1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
# Branch coverage over the application code; tests, scripts and the Android
# client are excluded. Sandbox workers run in child processes and are not traced.
branch = true
source = ["."]
omit = ["tests/*", "scripts/*", "tools/*", "android/*", "build/*", ".venv/*", "conftest.py"]

[tool.coverage.report]
skip_empty = true
fail_under = 82
precision = 1

[tool.mypy]
# Static type check of the application packages and entry modules (CI gate).
# Third-party libraries without stubs are treated as Any.
python_version = "3.12"
files = ["bank_core", "bank_agent", "bank_security", "bank_planning", "*.py"]
exclude = ["^build/", "^tests/", "^scripts/", "^tools/"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# These mixins are only ever used through conversation.ConversationManager,
# which supplies the shared state (_lock, _graph, _approvals, ...) they read.
module = ["bank_agent.conversation_turns", "bank_agent.conversation_approvals"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# FastAPI injects ``request: Request = None``; an Optional[Request] annotation
# would instead turn it into a query parameter.
module = ["bank_core.routes.*"]
implicit_optional = true

[tool.ruff]
line-length = 140
target-version = "py310"
exclude = ["venv", ".venv", ".venv-*", "env", ".runtime", ".pytest_cache", ".ruff_cache", ".mypy_cache"]

# Keep the CI gate focused on correctness.  The project intentionally contains
# long JSON/API payload declarations and supports Python 3.10 syntax; stricter
# pyupgrade/annotation rules would turn dependency upgrades into unrelated
# formatting migrations.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501"]
