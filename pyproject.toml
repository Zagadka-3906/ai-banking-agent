[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-banking-agent"
version = "2.0.0"
description = "安全可审计的银行 AI 智能体 Mock 沙箱"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.6",
  "requests==2.33.0",
  "langgraph==1.0.10",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-openai==1.1.14",
  "langchain-core==1.3.3",
  "cryptography==50.0.0",
  "python-dotenv==1.2.2",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py310"
exclude = ["venv", ".venv", ".venv-*", "env", ".runtime", ".pytest_cache", ".ruff_cache", ".mypy_cache"]

# Keep the CI gate focused on correctness.  The project intentionally contains
# long JSON/API payload declarations and supports Python 3.10 syntax; stricter
# pyupgrade/annotation rules would turn dependency upgrades into unrelated
# formatting migrations.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501"]
