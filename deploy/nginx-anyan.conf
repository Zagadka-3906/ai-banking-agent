# 安言: the only public entry. /core/ and /gateway/ map to the local services.
limit_req_zone $binary_remote_addr zone=anyan_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=anyan_turns:10m rate=20r/m;
# Over the budget: 429, so the app reports "too many requests", not an outage.
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/anyan/tls/server.pem;
    ssl_certificate_key /etc/anyan/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:anyan_ssl:5m;

    server_tokens off;
    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;

    # API explorers stay private.
    location ~ ^/(core|gateway)/(docs|redoc|openapi\.json) { return 404; }

    location /core/ {
        limit_req zone=anyan_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Messages, suggestions and speech cost model calls: a tighter per-address budget.
    location ~ ^/gateway/(api/v1/agent/(?:messages|speech/transcribe|conversations/[^/]+/suggestions).*)$ {
        limit_req zone=anyan_turns burst=15 nodelay;
        proxy_pass http://127.0.0.1:8100/$1$is_args$args;
        include /etc/nginx/anyan-stream.conf;
    }

    location /gateway/ {
        limit_req zone=anyan_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8100/;
        include /etc/nginx/anyan-stream.conf;
    }

    location / { return 404; }
}
