services:
  core:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      # Leave empty only for an isolated throw-away demo; production/shared
      # deployments must inject a random secret through .env/secret manager.
      BANK_AUTH_SECRET: ${BANK_AUTH_SECRET:-}
      BANK_DEMO_MODE: ${BANK_DEMO_MODE:-1}
      BANK_MFA_TEST_OTP: ${BANK_MFA_TEST_OTP:-888888}
      BANK_MFA_OTP: ${BANK_MFA_OTP:-}
      BANK_FACE_ATTEST_SECRET: ${BANK_FACE_ATTEST_SECRET:-demo-face-attest-secret-change-me}
      BANK_FACE_CHALLENGE_TTL_SECONDS: ${BANK_FACE_CHALLENGE_TTL_SECONDS:-60}
      BANK_REQUIRE_CLIENT_AUTH: ${BANK_REQUIRE_CLIENT_AUTH:-1}
      BANK_ADMIN_AUDIT_TOKEN: ${BANK_ADMIN_AUDIT_TOKEN:-}
      BANK_TOKEN_TTL_SECONDS: ${BANK_TOKEN_TTL_SECONDS:-120}
      BANK_MFA_TTL_SECONDS: ${BANK_MFA_TTL_SECONDS:-120}
      BANK_CIRCUIT_FAILURE_THRESHOLD: ${BANK_CIRCUIT_FAILURE_THRESHOLD:-5}
      BANK_CIRCUIT_WINDOW_SECONDS: ${BANK_CIRCUIT_WINDOW_SECONDS:-300}
      BANK_CIRCUIT_LOCKOUT_SECONDS: ${BANK_CIRCUIT_LOCKOUT_SECONDS:-300}
      BANK_MAX_INPUT_LENGTH: ${BANK_MAX_INPUT_LENGTH:-2000}
      BANK_MAX_TRANSFER_CENTS: ${BANK_MAX_TRANSFER_CENTS:-100000000}
      # Deployment posture: writes must present a session credential issued by
      # /api/v1/auth/login, not a self-asserted identity header.
      BANK_REQUIRE_SESSION: ${BANK_REQUIRE_SESSION:-1}
      BANK_LOGIN_REQUIRE_OTP: ${BANK_LOGIN_REQUIRE_OTP:-0}
      BANK_AUDIT_MAX_EVENTS: ${BANK_AUDIT_MAX_EVENTS:-5000}
      BANK_AUTH_TOKEN_MAX_RECORDS: ${BANK_AUTH_TOKEN_MAX_RECORDS:-20000}
      BANK_IDEMPOTENCY_TTL_SECONDS: ${BANK_IDEMPOTENCY_TTL_SECONDS:-86400}
      BANK_IDEMPOTENCY_MAX_RECORDS: ${BANK_IDEMPOTENCY_MAX_RECORDS:-10000}
      BANK_CORS_ORIGINS: ${BANK_CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
      # Push delivery (server half).  This is the *in-container* path; the key is
      # bind-mounted read-only from ./secrets below.  With no key present the
      # server degrades honestly: /api/v1/security/health reports
      # push.configured=false and dispatches audit NOT_SENT with the reason.
      BANK_FCM_CREDENTIALS: /run/secrets/fcm-service-account.json
      # Durable device registry.  Without it a container recreate forgets every
      # enrolled device and every delivery token, and push stops working until
      # each user signs in again.  Its integrity digest is keyed by the
      # BANK_AUTH_SECRET set above; with no secret it only detects corruption,
      # which /api/v1/security/health reports as integrity_keyed=false.
      BANK_DEVICE_STORE_PATH: /data/devices.json
      # Durable ledger snapshot: accounts, transactions and reservations
      # survive a container recreate instead of resetting to the demo seed.
      # Lives on the same /data volume as the device registry (the volume's
      # name is historical).
      BANK_LEDGER_STORE_PATH: /data/ledger.json
    ports:
      - "8000:8000"
    volumes:
      # A directory bind on purpose: a missing key is then simply "push not
      # configured" instead of a Compose error.  Override the source directory
      # with BANK_FCM_CREDENTIALS_DIR to reuse an existing secrets folder; the
      # file inside must be named fcm-service-account.json.  ./secrets is
      # git-ignored.
      - ${BANK_FCM_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - device-store:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Channel gateway: the HTTP surface a native client (the Android app) drives
  # the agent through.  It owns conversations, durable checkpoints and the
  # server-side approval registry; it never touches the ledger itself, and it
  # never hands a signed nonce or an MFA proof to a client.
  gateway:
    build: .
    command: uvicorn agent_api:app --host 0.0.0.0 --port 8100
    environment:
      BANK_API_BASE: http://core:8000/api/v1
      # Durable conversation state.  Mounted on a named volume so an approval
      # can still be resumed after the container is recreated.  The pending-
      # approval registry persists next to it by default
      # (/data/agent_conversations.sqlite3.approvals.json), so the approval a
      # client holds is still resolvable across a gateway recreate.
      BANK_CONVERSATION_DB: /data/agent_conversations.sqlite3
      BANK_CHANNEL_ID: app
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Must stay BELOW BANK_TOKEN_TTL_SECONDS: an approval handle points at a
      # nonce the core will refuse once expired.
      BANK_APPROVAL_TTL_SECONDS: ${BANK_APPROVAL_TTL_SECONDS:-110}
      BANK_AGENT_RATE_LIMIT_PER_MINUTE: ${BANK_AGENT_RATE_LIMIT_PER_MINUTE:-60}
      BANK_HTTP_TIMEOUT_SECONDS: ${BANK_HTTP_TIMEOUT_SECONDS:-8}
      BANK_CORS_ORIGINS: ${BANK_CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
      # Only meaningful until the login milestone lands: in demo mode a bare
      # X-User-Id is accepted because no credential exists yet.  Turn it off
      # together with switching the deployment to session-only writes.
      BANK_DEMO_MODE: ${BANK_DEMO_MODE:-1}
    ports:
      - "8100:8100"
    volumes:
      - agent-conversations:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      core:
        condition: service_healthy

  web:
    build: .
    command: streamlit run web_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      BANK_API_BASE: http://core:8000/api/v1
      BANK_DEMO_USER_ID: user_zhang
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BANK_DEMO_MODE: ${BANK_DEMO_MODE:-1}
      # The Streamlit process signs face challenges on behalf of the simulated
      # device SDK; it must share the same attestation key as the core.
      BANK_FACE_ATTEST_SECRET: ${BANK_FACE_ATTEST_SECRET:-demo-face-attest-secret-change-me}
      BANK_FACE_CHALLENGE_TTL_SECONDS: ${BANK_FACE_CHALLENGE_TTL_SECONDS:-60}
      BANK_HTTP_TIMEOUT_SECONDS: ${BANK_HTTP_TIMEOUT_SECONDS:-8}
      BANK_SANDBOX_TIMEOUT_SECONDS: ${BANK_SANDBOX_TIMEOUT_SECONDS:-1.5}
      BANK_SANDBOX_MAX_EXPRESSION: ${BANK_SANDBOX_MAX_EXPRESSION:-1000}
      BANK_SANDBOX_MAX_INPUT_BYTES: ${BANK_SANDBOX_MAX_INPUT_BYTES:-200000}
      BANK_SANDBOX_MAX_RESULT_BYTES: ${BANK_SANDBOX_MAX_RESULT_BYTES:-200000}
    ports:
      - "8501:8501"
    # The Dockerfile healthcheck targets the Core API on port 8000.  This
    # service runs Streamlit instead, so override it to avoid reporting the
    # UI container as permanently unhealthy.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      core:
        condition: service_healthy

volumes:
  # Conversation checkpoints, so a pending approval survives a container
  # recreate instead of evaporating with the process.
  agent-conversations:
  # Enrolled device keys and delivery tokens.  Keep this volume: dropping it
  # silently disables push for every user until they sign in again.
  device-store:
