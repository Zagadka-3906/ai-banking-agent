<div style="width:390px;height:844px;box-sizing:border-box;padding:28px 24px 12px;display:flex;flex-direction:column;gap:12px;background:#F7F6FA;color:#16131F;font-family:'Manrope','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden"><div style="display:flex;align-items:center;gap:4px;margin-left:-12px"><button aria-label="返回" style="width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M15 6l-6 6 6 6"/></svg></button><div><div style="font-size:17px;font-weight:600">调整额度</div><div style="font-size:12px;color:#4E4A5C">入口：卡片管家 → 额度</div></div></div><div style="display:flex;background:#fff;border:1.5px solid #16131F;border-radius:12px;padding:3px;gap:3px"><button style="flex:1;height:44px;border:0;border-radius:9px;background:none;font-size:13px;font-weight:500;color:#16131F">调低额度 · 黄</button><button style="flex:1;height:44px;border:0;border-radius:9px;background:#B9A9F5;font-size:13px;font-weight:600;color:#16131F">调高额度 · 红</button></div><div style="background:#fff;border:1.5px solid #16131F;border-radius:16px;box-shadow:3px 3px 0 #16131F;padding:14px;display:flex;flex-direction:column;gap:8px;"><div style="font-size:14px;font-weight:600">信用卡（尾号 8821）</div><div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:15px;color:#4E4A5C">¥50,000</span><span style="font-size:15px">→</span><span style="font-size:32px;font-weight:600;letter-spacing:-.02em">¥80,000</span></div><div style="display:flex;height:16px;border-radius:8px;border:1.5px solid #16131F;overflow:hidden;box-sizing:border-box;background:#fff"><div style="width:50%;background:#16131F"></div><div style="width:30%;background:#B9A9F5;border-left:1.5px solid #16131F"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#4E4A5C"><span>当前额度</span><span>申请增加 ¥30,000</span></div><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px"><span style="color:#4E4A5C">调整类型</span><span style="font-weight:400;text-align:right">永久调高</span></div><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px"><span style="color:#4E4A5C">审批</span><span style="font-weight:400;text-align:right">以银行风控结果为准</span></div></div><div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#4E4A5C"><span style="display:inline-flex;align-items:center;gap:5px;background:#FF5C4D;color:#16131F;border:1.5px solid #16131F;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>红 · 强验证</span>调高额度将进入强验证</div><div style="background:#EAE5FC;border:1.5px solid #16131F;border-radius:16px;box-shadow:2px 2px 0 #16131F;padding:14px;display:flex;flex-direction:column;gap:8px;"><span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;color:#B9A9F5;background:#16131F;padding:3px 10px;border-radius:6px;transform:rotate(-2deg)"><span style="width:6px;height:6px;background:#B9A9F5;transform:rotate(45deg)"></span>智能管家</span><div style="font-size:14px;line-height:1.6">调低额度只需确认（黄），随时可以再申请恢复。</div></div><div style="margin-top:auto;display:flex;gap:10px"><button style="flex:1;height:44px;border:1.5px solid #16131F;border-radius:12px;background:#B9A9F5;color:#16131F;font-size:14px;font-weight:600;letter-spacing:.04em;box-shadow:2px 2px 0 #16131F;display:flex;align-items:center;justify-content:center;gap:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.2" stroke-linecap="round" stroke-li
