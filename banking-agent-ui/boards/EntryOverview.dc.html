<div style="width:390px;height:844px;box-sizing:border-box;padding:28px 24px 12px;display:flex;flex-direction:column;gap:14px;background:#F7F6FA;color:#16131F;font-family:'Manrope','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden"><div><div style="font-size:26px;font-weight:700;letter-spacing:-.01em">用户入口</div><div style="font-size:14px;color:#4E4A5C">六类入口汇入同一个智能管家</div></div><div style="background:#fff;border:1.5px solid #16131F;border-radius:16px;box-shadow:3px 3px 0 #16131F;padding:14px;display:flex;flex-direction:column;gap:12px;"><div style="display:flex;align-items:flex-start;gap:10px"><span style="width:36px;height:36px;flex:none;border-radius:6px;background:#B9A9F5;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><div style="flex:1"><div style="font-size:14px;font-weight:700">1　对话输入</div><div style="font-size:12px;color:#4E4A5C;line-height:1.5">首页输入框，文字或语音，任意说法</div><div style="font-size:12px;line-height:1.5;display:flex;gap:4px;align-items:flex-start"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>先展示「我的理解」与风险等级</span></div></div></div><div style="display:flex;align-items:flex-start;gap:10px"><span style="width:36px;height:36px;flex:none;border-radius:6px;background:#B9A9F5;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 5v14M5 12h14"/></svg></span><div style="flex:1"><div style="font-size:14px;font-weight:700">2　快捷提示</div><div style="font-size:12px;color:#4E4A5C;line-height:1.5">首页与场景页的提示，每条带等级图标</div><div style="font-size:12px;line-height:1.5;display:flex;gap:4px;align-items:flex-start"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>直达确认卡片或结果</span></div></div></div><div style="display:flex;align-items:flex-start;gap:10px"><span style="width:36px;height:36px;flex:none;border-radius:6px;background:#B9A9F5;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></svg></span><div style="flex:1"><div style="font-size:14px;font-weight:700">3　主动建议</div><div style="font-size:12px;color:#4E4A5C;line-height:1.5">智能管家依据账户事件主动推送</div><div style="font-size:12px;line-height:1.5;display:flex;gap:4px;align-items:flex-start"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>展示计划，点「查看计划」才开始</span></div></div></div><div style="display:flex;align-items:flex-start;gap:10px"><span style="width:36px;height:36px;flex:none;border-radius:6px;background:#B9A9F5;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></span><div style="flex:1"><div style="font-size:14px;font-weight:700">4　场景入口</div><div style="font-size:12px;color:#4E4A5C;line-height:1.5">底部导航，以及卡片管家、订阅管理</div><div style="font-size:12px;line-height:1.5;display:flex;gap:4px;align-items:flex-start"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>进入场景页，按钮按等级标注</span></div></div></div><div style="display:flex;align-items:flex-start;gap:10px"><span style="width:36px;height:36px;flex:none;border-radius:6px;background:#B9A9F5;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 8l9 6 9-6"/></svg></span><div style="flex:1"><div style="font-size:14px;font-weight:700">5　IM 渠道</div><div style="font-size:12px;color:#4E4A5C;line-height:1.5">服务号会话、菜单与通知卡片</div><div style="font-size:12px;line-height:1.5;display:flex;gap:4px;align-items:flex-start"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>绿 / 黄在聊天内完成，红跳转安全页</span></div></div></div><div style="display:flex;align-items:flex-start;gap:10px"><span style="width:36px;height:36px;flex:none;border-radius:6px;background:#B9A9F5;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg></span><div style="flex:1"><div style="font-size:14px;font-weight:700">6　系统触发</div><div style="font-size:12px;color:#4E4A5C;line-height:1.5">风控拦截、到期提醒、异常告警</div><div style="font-size:12px;line-height:1.5;display:flex;gap:4px;align-items:flex-start"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>先拦截或提醒，再给一键处置</span></div></div></div></div><div style="background:#EAE5FC;border:1.5px solid #16131F;border-radius:16px;box-shadow:2px 2px 0 #16131F;padding:14px;display:flex;flex-direction:column;gap:8px;"><div style="font-size:13px;font-weight:600">无论从哪里进入，都走同一条链路</div><div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px"><span style="display:inline-flex;align-items:center;gap:5px;background:#E6E4EC;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap">入口</span><span style="font-size:12px">→</span><span style="display:inline-flex;align-items:center;gap:5px;background:#E6E4EC;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap">理解意图</span><span style="font-size:12px">→</span><span style="display:inline-flex;align-items:center;gap:5px;background:#E6E4EC;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap">风险分级</span><span style="font-size:12px">→</span><span style="display:inline-flex;align-items:center;gap:5px;background:#E6E4EC;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap">确认 / 强验证</span><span style="font-size:12px">→</span><span style="display:inline-flex;align-items:center;gap:5px;background:#E6E4EC;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap">执行</span><span style="font-size:12px">→</span><span style="display:inline-flex;align-items:center;gap:5px;background:#E6E4EC;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap">结果与审计</span></div></div></div>
