<div style="width:390px;height:844px;box-sizing:border-box;padding:0;display:flex;flex-direction:column;gap:0px;background:#EEECF4;color:#16131F;font-family:'Manrope','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden"><div style="background:#fff;border-bottom:1.5px solid #16131F;padding:30px 12px 10px;display:flex;align-items:center;gap:6px"><button aria-label="返回" style="width:36px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M15 6l-6 6 6 6"/></svg></button><span style="width:36px;height:36px;border-radius:10px;background:#B9A9F5;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></svg></span><div><div style="font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px">智能管家 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></div><div style="font-size:12px;color:#4E4A5C">官方服务号 · 对话已加密</div></div></div><div style="flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 14px 0"><div style="align-self:flex-start;max-width:92%;background:#fff;border:1.5px solid #16131F;border-radius:4px 16px 16px 16px;box-shadow:2px 2px 0 #16131F;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6"><div style="display:flex;gap:6px;flex-wrap:wrap"><span style="display:inline-flex;align-items:center;gap:5px;background:#FF5C4D;color:#16131F;border:1.5px solid #16131F;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>红 · 强验证</span><span style="display:inline-flex;align-items:center;gap:5px;background:#FF5C4D;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M6 6l12 12M18 6L6 18"/></svg>失败</span></div><div><b>验证未通过</b>，验证码错误或已过期。</div><div style="background:#F7F6FA;border:1.5px solid #16131F;border-radius:16px;box-shadow:2px 2px 0 #16131F;padding:12px;display:flex;flex-direction:column;gap:10px;"><div style="display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;flex:none;border-radius:9px;background:#FF5C4D;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M6 6l12 12M18 6L6 18"/></svg></span><div style="flex:1"><div style="font-size:14px;font-weight:600">安全验证</div><div style="font-size:12px;color:#4E4A5C;line-height:1.5">第 2 次未通过</div></div><span style="display:inline-flex;align-items:center;gap:5px;background:#FF5C4D;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M6 6l12 12M18 6L6 18"/></svg>失败</span></div><div style="display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;flex:none;border-radius:9px;background:#E6E4EC;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg></span><div style="flex:1"><div style="font-size:14px;font-weight:600">转账 ¥4,500.00</div><div style="font-size:12px;color:#4E4A5C;line-height:1.5">已取消，资金未转出</div></div><span style="display:inline-flex;align-items:center;gap:5px;background:#E6E4EC;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>已回滚</span></div></div><div style="font-size:12px;color:#4E4A5C">还可尝试 1 次 · 连续 3 次失败将锁定 30 分钟</div><div style="display:flex;gap:8px"><button style="flex:1;height:44px;border:1.5px solid #16131F;border-radius:12px;background:#B9A9F5;color:#16131F;font-size:14px;font-weight:600;letter-spacing:.04em;box-shadow:2px 2px 0 #16131F;display:flex;align-items:center;justify-content:center;gap:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>重新发起转账验证</button><button style="flex:1;height:44px;border:1.5px solid #16131F;border-radius:12px;background:#fff;color:#16131F;font-size:14px;font-weight:600;letter-spacing:.04em;box-shadow:2px 2px 0 #16131F;display:flex;align-items:center;justify-content:center;gap:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1z"/></svg>联系人工客服</button></div></div><div style="align-self:center"><span style="display:inline-flex;align-items:center;gap:5px;background:#E6E4EC;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>聊天内不会重发或索要验证码</span></div></div><div style="padding:10px 12px 14px;background:#fff;border-top:1.5px solid #16131F;display:flex;align-items:center;gap:8px"><button aria-label="更多" style="width:44px;height:44px;border-radius:12px;border:1.5px solid #16131F;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 5v14M5 12h14"/></svg></button><span style="flex:1;height:44px;box-sizing:border-box;border:1.5px solid #16131F;border-radius:12px;background:#F7F6FA;padding:0 12px;display:flex;align-items:center;font-size:14px;color:#4E4A5C">说出你要办的业务，如：查余额</span><button aria-label="按住说话" style="height:44px;padding:0 8px;border:0;background:none;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#16131F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>按住说话</button></div></div>
