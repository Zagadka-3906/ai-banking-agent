<div style="width:390px;height:844px;box-sizing:border-box;padding:28px 24px 12px;display:flex;flex-direction:column;gap:14px;background:#F7F6FA;color:#16131F;font-family:'Manrope','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden"><div style="display:flex;align-items:center;gap:4px;margin-left:-12px"><button aria-label="返回" style="width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M15 6l-6 6 6 6"/></svg></button><div><div style="font-size:17px;font-weight:600">取消订阅</div><div style="font-size:12px;color:#4E4A5C">入口：主动建议 · 1/2 确认</div></div></div><div style="align-self:flex-end;max-width:84%;background:#B9A9F5;border:1.5px solid #16131F;border-radius:18px 18px 4px 18px;box-shadow:3px 3px 0 #16131F;padding:12px 14px;font-size:15px;line-height:1.5">把没在用的订阅都取消了</div><div style="align-self:flex-start;max-width:94%"><div style="background:#fff;border:1.5px solid #16131F;border-radius:16px;box-shadow:3px 3px 0 #16131F;padding:14px;display:flex;flex-direction:column;gap:10px;"><div style=font-size:14px;line-height:1.6>识别到 2 项近 60 天未使用、仍在按月扣款的订阅，建议取消。</div><div style="background:#F7F6FA;border:1.5px solid #16131F;border-radius:16px;box-shadow:2px 2px 0 #16131F;padding:12px;display:flex;flex-direction:column;gap:8px;"><div style="display:flex;justify-content:space-between;align-items:center"><span style="display:inline-flex;align-items:center;gap:5px;background:#FFC933;color:#16131F;border:1.5px solid #16131F;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>黄 · 需确认</span><span style="display:inline-flex;align-items:center;gap:5px;background:#B9A9F5;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>待确认</span></div><div style="font-size:15px;font-weight:600">请核对取消内容</div><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px"><span style="color:#4E4A5C">视频会员</span><span style="font-weight:400;text-align:right">¥25.00/月 · 连续 8 次</span></div><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px"><span style="color:#4E4A5C">音乐会员</span><span style="font-weight:400;text-align:right">¥15.00/月 · 连续 12 次</span></div><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px"><span style="color:#4E4A5C">取消后</span><span style="font-weight:400;text-align:right">10 月 5 日、18 日起不再扣款</span></div><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px"><span style="color:#4E4A5C">每月节省</span><span style="font-weight:600;text-align:right">¥40.00</span></div><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px"><span style="color:#4E4A5C">可恢复</span><span style="font-weight:400;text-align:right">7 天内可一键恢复</span></div><div style="display:flex;gap:6px;align-items:center;font-size:12px;color:#4E4A5C;border-top:1.5px dashed #C9C4D6;padding-top:8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>依据：近 60 天无使用记录 · 来源：核心流水</div><div style="display:flex;flex-direction:column;gap:8px"><button style="flex:none;width:100%;height:44px;border:1.5px solid #16131F;border-radius:12px;background:#B9A9F5;color:#16131F;font-size:14px;font-weight:600;letter-spacing:.04em;box-shadow:2px 2px 0 #16131F;display:flex;align-items:center;justify-content:center;gap:6px;">确认取消 2 项订阅</button><button style="flex:none;width:100%;height:44px;border:1.5px solid #16131F;border-radius:12px;background:#fff;color:#16131F;font-size:14px;font-weight:600;letter-spacing:.04em;box-shadow:2px 2px 0 #16131F;display:flex;align-items:center;justify-content:center;gap:6px;">保留全部订阅</button></div></div></div></div><div style="margin-top:auto"><div style="display:flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #16131F;border-radius:16px;box-shadow:3px 3px 0 #16131F;padding:4px 4px 4px 16px"><span style="flex:1;font-size:14px;color:#4E4A5C">补充或修改你的要求</span><button aria-label="按住说话" style="height:44px;padding:0 8px;border:0;background:none;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#16131F"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>按住说话</button><button aria-label="发送请求" style="height:44px;padding:0 10px;border-radius:12px;border:1.5px solid #16131F;background:#B9A9F5;box-shadow:2px 2px 0 #16131F;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#16131F">发送请求<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div></div>
