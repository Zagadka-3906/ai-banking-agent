<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>风险提醒</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
html,body{margin:0;overflow:hidden;scrollbar-width:none;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
x-dc{display:block}
b{font-weight:500}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;padding:36px 24px 12px;display:flex;flex-direction:column;gap:16px;background:#F7F6FA;color:#16131F;font-family:'Manrope','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden">
<div style="display:flex;align-items:center;gap:4px;margin-left:-12px">
<button aria-label="返回" style="width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
<div style="font-size:17px;font-weight:500">风险提醒</div>
</div>
<div style="background:#FFE4DF;border:1.5px solid #16131F;border-radius:16px;padding:16px;box-shadow:4px 4px 0 #16131F;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px">
<div style="width:40px;height:40px;border-radius:12px;background:#FF5C4D;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg></div>
<div><div style="font-size:17px;font-weight:500">已拦截一笔可疑转账</div><div style="font-size:13px;color:#4E4A5C">今天 14:07 · 风控系统自动拦截</div></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:30px;font-weight:600;letter-spacing:-.02em">¥28,000.00</span><span style="font-size:14px;color:#4E4A5C">收款账户 尾号 5519</span></div>
<div style="font-size:13px;line-height:1.6">该账户近期被多名用户举报涉嫌诈骗，且您与收款人为首次交易。资金仍在您的账户中。</div>
<div style="display:flex;gap:10px">
<button style="flex:1;height:44px;border:1.5px solid #16131F;border-radius:12px;background:#FF5C4D;color:#16131F;box-shadow:2px 2px 0 #16131F;font-size:15px;font-weight:600;letter-spacing:.06em">不是我，冻结此卡</button>
<button style="flex:1;height:44px;border:1.5px solid #16131F;border-radius:12px;background:#fff;color:#16131F;box-shadow:2px 2px 0 #16131F;font-size:15px;letter-spacing:.06em">是我，验证后放行</button>
</div>
</div>
<div>
<div style="font-size:12px;letter-spacing:.08em;color:#4E4A5C;margin-bottom:8px">安全状态</div>
<div style="background:#fff;border:1.5px solid #16131F;border-radius:16px;box-shadow:3px 3px 0 #16131F;padding:2px 16px">
<div style="display:flex;align-items:center;gap:12px;padding:9px 0">
<div style="width:36px;height:36px;border-radius:10px;background:#6EDC6A;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<div style="flex:1"><div style="font-size:15px">面容验证</div><div style="font-size:13px;color:#4E4A5C">已开启，用于登录与转账</div></div>
<span style="background:#6EDC6A;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600">已开启</span>
</div>
<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1.5px dashed #C9C4D6">
<div style="width:36px;height:36px;border-radius:10px;background:#FFC933;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"/></svg></div>
<div style="flex:1"><div style="font-size:15px">今日转账额度</div><div style="font-size:13px;color:#4E4A5C">已用 ¥40,000 / ¥50,000</div></div>
<span style="background:#FFC933;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600">接近上限</span>
</div>
<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1.5px dashed #C9C4D6">
<div style="width:36px;height:36px;border-radius:10px;background:#7AA8FF;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></div>
<div style="flex:1"><div style="font-size:15px">新设备登录</div><div style="font-size:13px;color:#4E4A5C">需短信验证码确认</div></div>
<span style="background:#7AA8FF;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600">提示</span>
</div>
<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1.5px dashed #C9C4D6">
<div style="width:36px;height:36px;border-radius:10px;background:#E6E4EC;border:1.5px solid #16131F;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
<div style="flex:1"><div style="font-size:15px">身份信息更新</div><div style="font-size:13px;color:#4E4A5C">审核中，预计 1 个工作日</div></div>
<span style="background:#E6E4EC;color:#16131F;border:1.5px solid #16131F;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600">处理中</span>
</div>
</div>
</div>
<div style="margin-top:auto;background:#EAE5FC;color:#16131F;border:1.5px solid #16131F;border-radius:16px;padding:16px;box-shadow:3px 3px 0 #16131F;display:flex;flex-direction:column;gap:12px">
<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;color:#B9A9F5;background:#16131F;padding:3px 10px;border-radius:6px;transform:rotate(-2deg)"><span style="width:6px;height:6px;background:#B9A9F5;transform:rotate(45deg)"></span>智能管家</span>
<div style="font-size:14px;line-height:1.6">我已暂时冻结向该账户转账的通道，并通知风控团队。要现在为您修改登录密码吗？</div>
<div style="display:flex;gap:10px">
<button style="flex:1;height:44px;border:1.5px solid #16131F;border-radius:12px;background:#B9A9F5;color:#16131F;box-shadow:2px 2px 0 #16131F;font-size:15px;font-weight:600;letter-spacing:.06em">验证并修改密码</button>
<button style="flex:1;height:44px;border:1.5px solid #16131F;border-radius:12px;background:#fff;color:#16131F;box-shadow:2px 2px 0 #16131F;font-size:15px;letter-spacing:.06em">稍后提醒我</button>
</div>
</div>
</div>
</x-dc>
</body>
</html>
