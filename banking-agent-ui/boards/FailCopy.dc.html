<div style="width:390px;height:1280px;box-sizing:border-box;padding:28px 24px 12px;display:flex;flex-direction:column;gap:12px;background:#F7F6FA;color:#16131F;font-family:'Manrope','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden"><div><div style="font-size:26px;font-weight:700;letter-spacing:-.01em">失败与回滚文案</div><div style="font-size:14px;color:#4E4A5C">重试 · 回滚记录 · 换方式 · 转人工</div></div><div style="background:#fff;border:1.5px solid #16131F;border-radius:16px;box-shadow:2px 2px 0 #16131F;padding:12px;display:flex;flex-direction:column;gap:8px;"><div style="font-size:13px;font-weight:700">转账失败</div><div style="display:flex;flex-wrap:wrap;gap:6px;padding-left:0px"><span style="display:inline-flex;align-items:center;gap:5px;background:#B9A9F5;color:#16131F;border:1.5px solid #16131F;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap">验证并重新提交转账</span><span style="display:inline-flex;align-items:center;gap:5px;background:#fff;color:#16131F;border:1.5px solid #16131F;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap">查看资金回滚记录</span><span style="display:inline-flex;align-items:center;gap:5px;background:#fff;color:#16131F;border:1.5px solid #16131F;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap">联系人工客服</span></div></div><div style="background:#fff;border:1.5px solid #16131F;border-radius:16px;box-shadow:2px 2px 0 #16131F;padding:12px;display:flex;flex-direction:column;gap:8px;"><div style="font-size:13px;font-weight:700">强验证与熔断</div><div style="display:flex;flex-wrap:wrap;gap:6px;padding-left:0px"><span style="display:inline-flex;align-items:center;gap:5px;background:#fff;color:#16131F;border:1.5px solid #16131F;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap">改用短信验证码</span><span style="display:inline-flex;align-items:center;gap:5px;background:#fff;color:#16131F;border:1.5px solid #16131F;border-radius:8px;
