name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check . --ignore E402
      - name: Dependency audit (pip-audit)
        # Online runs fail on known CVEs; offline runs skip instead of failing
        # so local, no-network machines keep the rest of the suite green.
        run: |
          if python -m pip_audit --version >/dev/null 2>&1 && python -c "import urllib.request; urllib.request.urlopen('https://pypi.org/simple/', timeout=10)" 2>/dev/null; then
            python -m pip_audit -r requirements.txt --progress-spinner off
          else
            echo "pip-audit skipped: network unreachable (offline run)."
          fi
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Installs cmdline-tools, accepts licences, and provisions the exact SDK
      # packages required by compileSdk 35.  local.properties is deliberately
      # git-ignored, so nothing machine-specific is committed.
      - uses: android-actions/setup-android@v3
        with:
          # The action's default still includes the retired SDK package
          # "tools", which sdkmanager no longer publishes.  Install only the
          # packages this compileSdk 35 build actually needs.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build debug APK and instrumented test APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          # assembleDebugAndroidTest keeps the UI tests compiling.  Running them
          # needs an emulator plus the live banking stack, so they are exercised
          # locally (see app/src/androidTest/.../LoginAndChatUiTest.kt); CI only
          # guarantees they still build.
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bank-agent-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
