name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check . --ignore E402
      - name: Validate Compose file
        run: docker compose config --quiet

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Installs cmdline-tools and accepts the SDK licences; AGP then resolves
      # the platform/build-tools it needs through ANDROID_HOME (local.properties
      # is deliberately git-ignored, so nothing machine-specific is committed).
      - uses: android-actions/setup-android@v3
      - name: Build debug APK and instrumented test APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          # assembleDebugAndroidTest keeps the UI tests compiling.  Running them
          # needs an emulator plus the live banking stack, so they are exercised
          # locally (see app/src/androidTest/.../LoginAndChatUiTest.kt); CI only
          # guarantees they still build.
          ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bank-agent-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
