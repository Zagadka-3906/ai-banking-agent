name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check . --ignore E402
      - name: Dependency audit (pip-audit)
        # Online runs fail on known CVEs; offline runs skip instead of failing
        # so local, no-network machines keep the rest of the suite green.
        run: |
          if python -m pip_audit --version >/dev/null 2>&1 && python -c "import urllib.request; urllib.request.urlopen('https://pypi.org/simple/', timeout=10)" 2>/dev/null; then
            python -m pip_audit -r requirements-feishu.txt --progress-spinner off
          else
            echo "pip-audit skipped: network unreachable (offline run)."
          fi
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Bootstrap the CLI only; install SDK packages with its native syntax.
      # local.properties remains ignored so no machine paths enter the repo.
      - uses: android-actions/setup-android@v3
        with:
          # CLI 23 understands SDK 37.0 metadata; the action defaults to CLI 16.
          cmdline-tools-version: "16111833"
          accept-android-sdk-licenses: false
          packages: ""
      - name: Install and verify Android SDK packages
        shell: bash
        run: |
          # Avoid the legacy sdkmanager wrapper and semicolon package syntax.
          android_cli="$(dirname "$(command -v sdkmanager)")/android"
          test -x "$android_cli"
          grep -Eq '^Pkg[.]Revision=23[.]0[[:space:]]*$' "$(dirname "$android_cli")/../source.properties"
          "$android_cli" --no-metrics --sdk="$ANDROID_HOME" sdk install platform-tools platforms/android-37.0 build-tools/36.0.0
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          grep -Eq '^AndroidVersion[.]ApiLevel=37[.]0[[:space:]]*$' "$ANDROID_HOME/platforms/android-37.0/source.properties"
          grep -Eq '^Pkg[.]Revision=36[.]0[.]0[[:space:]]*$' "$ANDROID_HOME/build-tools/36.0.0/source.properties"
      - name: Run Android unit tests, lint, and builds
        working-directory: android
        run: |
          chmod +x ./gradlew
          # assembleDebugAndroidTest keeps the UI tests compiling.  Running them
          # needs an emulator plus the live banking stack, so they are exercised
          # locally (see app/src/androidTest/.../LoginAndChatUiTest.kt); CI only
          # guarantees they still build.
          ./gradlew --no-daemon --stacktrace --warning-mode=all testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bank-agent-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
