name: Android isolated regression

on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * 1'

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements-dev.txt
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '16111833'
          packages: ''
      - name: Install build SDK
        shell: bash
        run: |
          android_cli="$(dirname "$(command -v sdkmanager)")/android"
          "$android_cli" --no-metrics --sdk="$ANDROID_HOME" sdk install platforms/android-37.0 build-tools/36.0.0
          chmod +x android/gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create a temporary device PIN
        shell: bash
        run: |
          pin="$(python -c 'import secrets; print(f"{secrets.randbelow(1000000):06d}")')"
          echo "::add-mask::$pin"
          printf 'BANK_TEST_DEVICE_PIN=%s\n' "$pin" >> "$GITHUB_ENV"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: bankagent-ci
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell locksettings set-pin "$BANK_TEST_DEVICE_PIN"
            python scripts/run_android_regression.py --serial emulator-5554 --output-dir build/ci-regression
      - name: Publish device regression summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("build/ci-regression/summary.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("## Android device regression\n\n")
              if path.exists():
                  summary = json.loads(path.read_text(encoding="utf-8"))
                  for key in ("tests", "failures", "errors", "skipped"):
                      report.write(f"- {key}: {summary[key]}\n")
              else:
                  report.write("No verified summary was produced; inspect the failed test step.\n")
          PY
      # The job summary remains available even when artifact storage is full.
      # Test failures still fail the job; optional archival cannot mask them.
      # Deliberately upload no raw logs, app data, tokens, PINs or account traces.
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('build/ci-regression/summary.json') != ''
        continue-on-error: true
        with:
          name: android-regression-summary
          path: build/ci-regression/summary.json
          if-no-files-found: error
          retention-days: 14
