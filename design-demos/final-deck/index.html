<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安言答辩 Deck</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #F6F3EB;
  color: #30312D;
}

.deck-container {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: relative;
}

.slide-frame {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

.controls {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.95);
  padding: 16px 24px;
  border-radius: 8px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
  display: flex;
  align-items: center;
  gap: 24px;
  z-index: 1000;
}

.btn {
  background: #30312D;
  color: #F6F3EB;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}

.btn:hover {
  background: #B39A68;
}

.page-indicator {
  font-size: 14px;
  font-weight: 600;
  color: #30312D;
  font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>

<div class="deck-container">
  <iframe id="slide-frame" class="slide-frame" src=""></iframe>
</div>

<div class="controls">
  <button class="btn" onclick="prevSlide()">← 上一页</button>
  <span class="page-indicator" id="page-indicator">1 / 13</span>
  <button class="btn" onclick="nextSlide()">下一页 →</button>
</div>

<script>
const SLIDES = [
  'slides/01-cover.html',
  'slides/02-nav.html',
  'slides/03-problem.html',
  'slides/04-capability.html',
  'slides/05-arch.html',
  'slides/06-evidence.html',
  'slides/07-permission.html',
  'slides/08-loop.html',
  'slides/09-interface.html',
  'slides/10-data.html',
  'slides/11-limitations.html',
  'slides/12-deliverables.html',
  'slides/13-closing.html'
];

let currentIndex = 0;

function loadSlide(index) {
  currentIndex = Math.max(0, Math.min(index, SLIDES.length - 1));
  document.getElementById('slide-frame').src = SLIDES[currentIndex];
  document.getElementById('page-indicator').textContent = `${currentIndex + 1} / ${SLIDES.length}`;
}

function nextSlide() {
  if (currentIndex < SLIDES.length - 1) {
    loadSlide(currentIndex + 1);
  }
}

function prevSlide() {
  if (currentIndex > 0) {
    loadSlide(currentIndex - 1);
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    nextSlide();
  } else if (e.key === 'ArrowLeft') {
    prevSlide();
  }
});

loadSlide(0);
</script>

</body>
</html>
