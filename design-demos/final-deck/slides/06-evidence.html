<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>证据链</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #F6F3EB;
  color: #30312D;
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  position: relative;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  height: 100%;
  padding: 80px 80px 60px 80px;
  position: relative;
}

.label-column {
  grid-column: 1 / 4;
  border-right: 0.5px solid #30312D;
  padding-right: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label-top {
  display: flex;
  flex-direction: column;
  gap: 120px;
}

.logo-mark {
  width: 72px;
  height: 72px;
}

.page-label {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6B6B68;
  font-family: 'Inter', sans-serif;
}

.label-bottom {
  font-size: 24px;
  line-height: 1.6;
  color: #6B6B68;
  font-weight: 300;
  font-family: 'Inter', sans-serif;
}

.content-area {
  grid-column: 4 / 13;
  display: flex;
  flex-direction: column;
  gap: 40px;
  padding-left: 48px;
}

.section-title {
  font-size: 72px;
  font-weight: 700;
  line-height: 1.1;
}

.flow-steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  flex: 1;
}

.step-card {
  border: 0.5px solid #30312D;
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.step-number {
  font-size: 120px;
  font-weight: 900;
  line-height: 0.9;
  font-family: 'Inter', sans-serif;
  color: #B39A68;
  font-variant-numeric: tabular-nums;
}

.step-title {
  font-size: 32px;
  font-weight: 700;
  line-height: 1.2;
}

.step-desc {
  font-size: 20px;
  line-height: 1.5;
  color: #4A4A47;
}

.step-note {
  font-size: 16px;
  color: #6B6B68;
  margin-top: auto;
  font-style: italic;
}
</style>
</head>
<body>

<div class="grid">
  <div class="label-column">
    <div class="label-top">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="logo-mark" role="img" aria-labelledby="brand-title"><title id="brand-title">安言</title><path fill="#30312D" d="M32 224V112C32 56 74 24 128 24C182 24 224 56 224 112V224H176V112C176 82 156 64 128 64C100 64 80 82 80 112V128H144V168H80V224Z" /></svg>
      <div class="page-label">Evidence</div>
    </div>
    <div class="label-bottom">
      证据链
    </div>
  </div>

  <div class="content-area">
    <div class="section-title">
      回答建立在本轮证据之上
    </div>

    <div class="flow-steps">
      <div class="step-card">
        <div class="step-number">1</div>
        <div class="step-title">理解</div>
        <div class="step-desc">识别当前请求<br>拆分查询目标<br>绑定对象与时间</div>
        <div class="step-note">识别暂停/纠正/继续</div>
      </div>

      <div class="step-card">
        <div class="step-number">2</div>
        <div class="step-title">取证</div>
        <div class="step-desc">读工具返回证据<br>受限表达式计算<br>保留来源</div>
        <div class="step-note">数值由程序计算</div>
      </div>

      <div class="step-card">
        <div class="step-number">3</div>
        <div class="step-title">生成</div>
        <div class="step-desc">依证据生成答案<br>确定性核验<br>语义核验</div>
        <div class="step-note">缺资料则补查</div>
      </div>

      <div class="step-card">
        <div class="step-number">4</div>
        <div class="step-title">修正</div>
        <div class="step-desc">表达有问题改写<br>缺证据明确失败<br>不编造数据</div>
        <div class="step-note">说明失败原因</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
