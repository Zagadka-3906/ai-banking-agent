<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>分权架构</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #F6F3EB;
  color: #30312D;
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  position: relative;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  height: 100%;
  padding: 80px 80px 60px 80px;
  position: relative;
}

.label-column {
  grid-column: 1 / 4;
  border-right: 0.5px solid #30312D;
  padding-right: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label-top {
  display: flex;
  flex-direction: column;
  gap: 120px;
}

.logo-mark {
  width: 72px;
  height: 72px;
}

.page-label {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6B6B68;
  font-family: 'Inter', sans-serif;
}

.label-bottom {
  font-size: 24px;
  line-height: 1.6;
  color: #6B6B68;
  font-weight: 300;
  font-family: 'Inter', sans-serif;
}

.content-area {
  grid-column: 4 / 13;
  display: flex;
  flex-direction: column;
  gap: 32px;
  padding-left: 48px;
}

.section-title {
  font-size: 72px;
  font-weight: 700;
  line-height: 1.1;
}

.arch-diagram {
  flex: 1;
  border: 0.5px solid #30312D;
  padding: 40px;
  background: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
}

.arch-diagram img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.arch-legend {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 24px;
  border-top: 0.5px solid #30312D;
  padding-top: 24px;
}

.legend-item {
  font-size: 20px;
  line-height: 1.4;
}

.legend-title {
  font-weight: 700;
  margin-bottom: 4px;
}

.legend-desc {
  color: #6B6B68;
  font-size: 16px;
}
</style>
</head>
<body>

<div class="grid">
  <div class="label-column">
    <div class="label-top">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="logo-mark" role="img" aria-labelledby="brand-title"><title id="brand-title">安言</title><path fill="#30312D" d="M32 224V112C32 56 74 24 128 24C182 24 224 56 224 112V224H176V112C176 82 156 64 128 64C100 64 80 82 80 112V128H144V168H80V224Z" /></svg>
      <div class="page-label">Architecture</div>
    </div>
    <div class="label-bottom">
      分权架构
    </div>
  </div>

  <div class="content-area">
    <div class="section-title">
      各司其职<br>模型不写账本
    </div>

    <div class="arch-diagram">
      <img src="../../docs/assets/系统架构图.svg" alt="系统架构图">
    </div>

    <div class="arch-legend">
      <div class="legend-item">
        <div class="legend-title">Android</div>
        <div class="legend-desc">登录 · 展示 · 确认</div>
      </div>
      <div class="legend-item">
        <div class="legend-title">Gateway</div>
        <div class="legend-desc">会话 · 证据 · 核验</div>
      </div>
      <div class="legend-item">
        <div class="legend-title">Mock Core</div>
        <div class="legend-desc">账本 · 权限 · 执行</div>
      </div>
      <div class="legend-item">
        <div class="legend-title">模型</div>
        <div class="legend-desc">理解 · 生成</div>
      </div>
      <div class="legend-item">
        <div class="legend-title">面板</div>
        <div class="legend-desc">高权限运维</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
