<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>真实界面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #F6F3EB;
  color: #30312D;
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  position: relative;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  height: 100%;
  padding: 80px 80px 60px 80px;
  position: relative;
}

.label-column {
  grid-column: 1 / 4;
  border-right: 0.5px solid #30312D;
  padding-right: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label-top {
  display: flex;
  flex-direction: column;
  gap: 120px;
}

.logo-mark {
  width: 72px;
  height: 72px;
}

.page-label {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6B6B68;
  font-family: 'Inter', sans-serif;
}

.label-bottom {
  font-size: 24px;
  line-height: 1.6;
  color: #6B6B68;
  font-weight: 300;
  font-family: 'Inter', sans-serif;
}

.content-area {
  grid-column: 4 / 13;
  display: flex;
  flex-direction: column;
  gap: 32px;
  padding-left: 48px;
}

.section-title {
  font-size: 72px;
  font-weight: 700;
  line-height: 1.1;
}

.screenshots-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 40px;
}

.screenshot-frame {
  border: 0.5px solid #30312D;
  padding: 24px;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.screenshot-img {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.screenshot-img img {
  max-height: 100%;
  height: auto;
  width: auto;
  max-width: 100%;
  object-fit: contain;
}

.screenshot-caption {
  font-size: 20px;
  color: #4A4A47;
  text-align: center;
  padding-top: 16px;
  border-top: 0.5px solid rgba(48, 49, 45, 0.2);
}

.screenshot-note {
  font-size: 16px;
  color: #6B6B68;
  text-align: center;
}
</style>
</head>
<body>

<div class="grid">
  <div class="label-column">
    <div class="label-top">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="logo-mark" role="img" aria-labelledby="brand-title"><title id="brand-title">安言</title><path fill="#30312D" d="M32 224V112C32 56 74 24 128 24C182 24 224 56 224 112V224H176V112C176 82 156 64 128 64C100 64 80 82 80 112V128H144V168H80V224Z" /></svg>
      <div class="page-label">Interface</div>
    </div>
    <div class="label-bottom">
      真实界面
    </div>
  </div>

  <div class="content-area">
    <div class="section-title">
      删除前确认<br>成功后同步服务器
    </div>

    <div class="screenshots-grid">
      <div class="screenshot-frame">
        <div class="screenshot-img">
          <img src="./ui-approval.png" alt="删除确认弹窗">
        </div>
        <div class="screenshot-caption">删除确认弹窗</div>
        <div class="screenshot-note">带姓名，取消不提交</div>
      </div>

      <div class="screenshot-frame">
        <div class="screenshot-img">
          <img src="./ui-workflow.png" alt="小额转账回执">
        </div>
        <div class="screenshot-caption">10 元模拟转账回执</div>
        <div class="screenshot-note">成功回执确认后才更新列表</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
