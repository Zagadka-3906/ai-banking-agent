<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>结尾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #F6F3EB;
  color: #30312D;
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  position: relative;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  height: 100%;
  padding: 80px 80px 60px 80px;
  position: relative;
}

.label-column {
  grid-column: 1 / 4;
  border-right: 0.5px solid #30312D;
  padding-right: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label-top {
  display: flex;
  flex-direction: column;
  gap: 120px;
}

.logo-mark {
  width: 72px;
  height: 72px;
}

.page-label {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6B6B68;
  font-family: 'Inter', sans-serif;
}

.label-bottom {
  font-size: 24px;
  line-height: 1.6;
  color: #6B6B68;
  font-weight: 300;
  font-family: 'Inter', sans-serif;
}

.content-area {
  grid-column: 4 / 13;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 80px;
  padding-left: 48px;
}

.core-proposition {
  font-size: 84px;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.01em;
}

.highlight {
  color: #B39A68;
}

.closing-block {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 48px;
  padding-top: 48px;
  border-top: 0.5px solid #30312D;
}

.closing-item {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.closing-label {
  font-size: 20px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #6B6B68;
  font-family: 'Inter', sans-serif;
}

.closing-value {
  font-size: 28px;
  line-height: 1.4;
  color: #30312D;
}

.closing-link {
  font-size: 24px;
  color: #B39A68;
  font-family: 'Inter', monospace;
  word-break: break-all;
}
</style>
</head>
<body>

<div class="grid">
  <div class="label-column">
    <div class="label-top">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="logo-mark" role="img" aria-labelledby="brand-title"><title id="brand-title">安言</title><path fill="#30312D" d="M32 224V112C32 56 74 24 128 24C182 24 224 56 224 112V224H176V112C176 82 156 64 128 64C100 64 80 82 80 112V128H144V168H80V224Z" /></svg>
      <div class="page-label">Closing</div>
    </div>
    <div class="label-bottom">
      安言银行智能体<br>
      2026 安全竞赛
    </div>
  </div>

  <div class="content-area">
    <div class="core-proposition">
      让自然语言交互<br>
      与<span class="highlight">确定的</span>资金执行<br>
      同时成立
    </div>

    <div class="closing-block">
      <div class="closing-item">
        <div class="closing-label">Repository</div>
        <div class="closing-link">github.com/Zagadka-3906/<br>ai-banking-agent</div>
      </div>

      <div class="closing-item">
        <div class="closing-label">Demo Entry</div>
        <div class="closing-value">隔离规则模式<br>真实 Android 演示</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
