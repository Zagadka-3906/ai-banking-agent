<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>信任缺口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #F6F3EB;
  color: #30312D;
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  position: relative;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  height: 100%;
  padding: 80px 80px 60px 80px;
  position: relative;
}

.label-column {
  grid-column: 1 / 4;
  border-right: 0.5px solid #30312D;
  padding-right: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label-top {
  display: flex;
  flex-direction: column;
  gap: 120px;
}

.logo-mark {
  width: 72px;
  height: 72px;
}

.page-label {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6B6B68;
  font-family: 'Inter', sans-serif;
}

.label-bottom {
  font-size: 24px;
  line-height: 1.6;
  color: #6B6B68;
  font-weight: 300;
  font-family: 'Inter', sans-serif;
}

.content-area {
  grid-column: 4 / 13;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 60px;
  padding-left: 48px;
}

.problem-title {
  font-size: 72px;
  font-weight: 700;
  line-height: 1.2;
}

.problem-body {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 48px;
  border-top: 0.5px solid #30312D;
  padding-top: 48px;
}

.problem-text {
  font-size: 28px;
  line-height: 1.6;
  color: #30312D;
}

.highlight {
  font-weight: 700;
  color: #B39A68;
}

.problem-challenge {
  font-size: 24px;
  line-height: 1.6;
  color: #4A4A47;
  border-left: 2px solid #B39A68;
  padding-left: 24px;
}
</style>
</head>
<body>

<div class="grid">
  <div class="label-column">
    <div class="label-top">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="logo-mark" role="img" aria-labelledby="brand-title"><title id="brand-title">安言</title><path fill="#30312D" d="M32 224V112C32 56 74 24 128 24C182 24 224 56 224 112V224H176V112C176 82 156 64 128 64C100 64 80 82 80 112V128H144V168H80V224Z" /></svg>
      <div class="page-label">Problem</div>
    </div>
    <div class="label-bottom">
      信任缺口
    </div>
  </div>

  <div class="content-area">
    <div class="problem-title">
      自然语言做资金操作<br>
      难点不是能不能答<br>
      是能不能保证执行对
    </div>

    <div class="problem-body">
      <div class="problem-text">
        大模型能理解「给张三转 500」，也能生成流畅的回答。<span class="highlight">但谁来保证这笔钱真的转给了张三？转对了金额？经过了授权？有可核对的回执？</span>
      </div>

      <div class="problem-challenge">
        安言的回答是：模型不持有账本写权限。资金操作由独立核心按三级权限执行。每一笔都有预检、确认、提交、回执四个环节，形成可核对的闭环。
      </div>
    </div>
  </div>
</div>

</body>
</html>
