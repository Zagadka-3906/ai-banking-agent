<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>能力总览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #F6F3EB;
  color: #30312D;
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  position: relative;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  height: 100%;
  padding: 80px 80px 60px 80px;
  position: relative;
}

.label-column {
  grid-column: 1 / 4;
  border-right: 0.5px solid #30312D;
  padding-right: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label-top {
  display: flex;
  flex-direction: column;
  gap: 120px;
}

.logo-mark {
  width: 72px;
  height: 72px;
}

.page-label {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6B6B68;
  font-family: 'Inter', sans-serif;
}

.label-bottom {
  font-size: 24px;
  line-height: 1.6;
  color: #6B6B68;
  font-weight: 300;
  font-family: 'Inter', sans-serif;
}

.content-area {
  grid-column: 4 / 13;
  display: flex;
  flex-direction: column;
  gap: 48px;
  padding-left: 48px;
}

.section-title {
  font-size: 72px;
  font-weight: 700;
  line-height: 1.1;
}

.capability-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 32px;
  flex: 1;
}

.cap-card {
  border: 0.5px solid #30312D;
  padding: 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.cap-title {
  font-size: 36px;
  font-weight: 700;
}

.cap-list {
  font-size: 24px;
  line-height: 1.6;
  color: #4A4A47;
  list-style: none;
}

.cap-list li::before {
  content: '·';
  margin-right: 8px;
  color: #B39A68;
}

.cap-note {
  font-size: 20px;
  color: #6B6B68;
  margin-top: auto;
  font-style: italic;
}
</style>
</head>
<body>

<div class="grid">
  <div class="label-column">
    <div class="label-top">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="logo-mark" role="img" aria-labelledby="brand-title"><title id="brand-title">安言</title><path fill="#30312D" d="M32 224V112C32 56 74 24 128 24C182 24 224 56 224 112V224H176V112C176 82 156 64 128 64C100 64 80 82 80 112V128H144V168H80V224Z" /></svg>
      <div class="page-label">Capability</div>
    </div>
    <div class="label-bottom">
      能力总览
    </div>
  </div>

  <div class="content-area">
    <div class="section-title">
      查询与模拟办理<br>四类业务对象
    </div>

    <div class="capability-grid">
      <div class="cap-card">
        <div class="cap-title">账户与交易</div>
        <ul class="cap-list">
          <li>余额查询</li>
          <li>消费明细与统计</li>
          <li>转账（小额/大额）</li>
        </ul>
        <div class="cap-note">区分咨询与确认</div>
      </div>

      <div class="cap-card">
        <div class="cap-title">理财与持仓</div>
        <ul class="cap-list">
          <li>持仓查询</li>
          <li>理财申购</li>
          <li>预约赎回</li>
        </ul>
        <div class="cap-note">风险等级独立判定</div>
      </div>

      <div class="cap-card">
        <div class="cap-title">卡片管理</div>
        <ul class="cap-list">
          <li>卡片状态查询</li>
          <li>挂失与解挂</li>
          <li>冻结与解冻</li>
        </ul>
        <div class="cap-note">询问影响不会执行</div>
      </div>

      <div class="cap-card">
        <div class="cap-title">订阅与安排</div>
        <ul class="cap-list">
          <li>联系人管理</li>
          <li>生日转账安排</li>
          <li>定期提醒</li>
        </ul>
        <div class="cap-note">切换话题只答当前问题</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
