<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>三级权限</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #F6F3EB;
  color: #30312D;
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  position: relative;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  height: 100%;
  padding: 80px 80px 60px 80px;
  position: relative;
}

.label-column {
  grid-column: 1 / 4;
  border-right: 0.5px solid #30312D;
  padding-right: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label-top {
  display: flex;
  flex-direction: column;
  gap: 120px;
}

.logo-mark {
  width: 72px;
  height: 72px;
}

.page-label {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6B6B68;
  font-family: 'Inter', sans-serif;
}

.label-bottom {
  font-size: 24px;
  line-height: 1.6;
  color: #6B6B68;
  font-weight: 300;
  font-family: 'Inter', sans-serif;
}

.content-area {
  grid-column: 4 / 13;
  display: flex;
  flex-direction: column;
  gap: 40px;
  padding-left: 48px;
}

.section-title {
  font-size: 72px;
  font-weight: 700;
  line-height: 1.1;
}

.perm-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  flex: 1;
}

.perm-card {
  border: 0.5px solid #30312D;
  padding: 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.perm-badge {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: 900;
  color: #FFFFFF;
}

.perm-green { background: #6B8E6F; }
.perm-yellow { background: #C9A861; }
.perm-red { background: #8B4C4C; }

.perm-title {
  font-size: 36px;
  font-weight: 700;
}

.perm-desc {
  font-size: 24px;
  line-height: 1.5;
  color: #4A4A47;
}

.perm-examples {
  font-size: 20px;
  line-height: 1.5;
  color: #6B6B68;
  list-style: none;
}

.perm-examples li::before {
  content: '·';
  margin-right: 8px;
}

.perm-note {
  font-size: 16px;
  color: #6B6B68;
  margin-top: auto;
  border-top: 0.5px solid rgba(48, 49, 45, 0.2);
  padding-top: 16px;
}

.footnote {
  font-size: 20px;
  color: #6B6B68;
  padding-top: 16px;
  border-top: 0.5px solid #30312D;
}
</style>
</head>
<body>

<div class="grid">
  <div class="label-column">
    <div class="label-top">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="logo-mark" role="img" aria-labelledby="brand-title"><title id="brand-title">安言</title><path fill="#30312D" d="M32 224V112C32 56 74 24 128 24C182 24 224 56 224 112V224H176V112C176 82 156 64 128 64C100 64 80 82 80 112V128H144V168H80V224Z" /></svg>
      <div class="page-label">Permission</div>
    </div>
    <div class="label-bottom">
      三级权限
    </div>
  </div>

  <div class="content-area">
    <div class="section-title">
      核心判定<br>逐级加码
    </div>

    <div class="perm-grid">
      <div class="perm-card">
        <div class="perm-badge perm-green">绿</div>
        <div class="perm-title">本人只读</div>
        <div class="perm-desc">查询本人账户、交易记录、持仓</div>
        <ul class="perm-examples">
          <li>余额查询</li>
          <li>消费统计</li>
          <li>持仓查询</li>
        </ul>
        <div class="perm-note">无需确认，即时返回</div>
      </div>

      <div class="perm-card">
        <div class="perm-badge perm-yellow">黄</div>
        <div class="perm-title">用户确认</div>
        <div class="perm-desc">小额转账、卡片操作、理财预约</div>
        <ul class="perm-examples">
          <li>≤ 200 元转账</li>
          <li>卡片解挂</li>
          <li>理财申购</li>
        </ul>
        <div class="perm-note">核对对象、金额后确认</div>
      </div>

      <div class="perm-card">
        <div class="perm-badge perm-red">红</div>
        <div class="perm-title">设备签名</div>
        <div class="perm-desc">大额转账、关键卡片变更、累计超限</div>
        <ul class="perm-examples">
          <li>> 200 元转账</li>
          <li>卡片挂失</li>
          <li>累计 500 元</li>
        </ul>
        <div class="perm-note">演示 OTP + 登记设备签名</div>
      </div>
    </div>

    <div class="footnote">
      注：业务语义色（绿黄红）仅表示风险等级，非品牌色。权限由核心计算，单笔与累计共同生效，调高额度不取消验证。
    </div>
  </div>
</div>

</body>
</html>
