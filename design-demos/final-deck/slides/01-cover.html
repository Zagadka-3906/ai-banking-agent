<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>安言 · 封面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #F6F3EB;
  color: #30312D;
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  position: relative;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  height: 100%;
  padding: 80px 80px 60px 80px;
  position: relative;
}

/* 左栏标签带 */
.label-column {
  grid-column: 1 / 4;
  border-right: 0.5px solid #30312D;
  padding-right: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label-top {
  display: flex;
  flex-direction: column;
  gap: 120px;
}

.logo-mark {
  width: 72px;
  height: 72px;
}

.page-label {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6B6B68;
  font-family: 'Inter', sans-serif;
}

.label-bottom {
  font-size: 24px;
  line-height: 1.6;
  color: #6B6B68;
  font-weight: 300;
  font-family: 'Inter', sans-serif;
}

/* 右侧内容区 */
.content-area {
  grid-column: 4 / 13;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 80px;
  padding-left: 48px;
}

.title-block {
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.main-title {
  font-size: 160px;
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -0.02em;
  font-family: 'Noto Sans SC', sans-serif;
}

.subtitle {
  font-size: 28px;
  font-weight: 400;
  line-height: 1.5;
  max-width: 800px;
  font-family: 'Noto Sans SC', sans-serif;
}

.disclaimer {
  font-size: 24px;
  line-height: 1.6;
  max-width: 900px;
  color: #6B6B68;
  border-top: 0.5px solid #30312D;
  padding-top: 24px;
  margin-top: 40px;
}

/* 网格线辅助（可选，生产环境移除） */
.grid::before {
  content: '';
  position: absolute;
  top: 0;
  left: 80px;
  right: 80px;
  height: 100%;
  background-image: repeating-linear-gradient(
    to right,
    transparent,
    transparent calc((100% - 11 * 24px) / 12),
    rgba(179, 154, 104, 0.1) calc((100% - 11 * 24px) / 12),
    rgba(179, 154, 104, 0.1) calc((100% - 11 * 24px) / 12 + 24px)
  );
  pointer-events: none;
  z-index: 0;
}

.grid > * {
  position: relative;
  z-index: 1;
}
</style>
</head>
<body>

<div class="grid">
  <div class="label-column">
    <div class="label-top">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="logo-mark" role="img" aria-labelledby="brand-title"><title id="brand-title">安言</title><path fill="#30312D" d="M32 224V112C32 56 74 24 128 24C182 24 224 56 224 112V224H176V112C176 82 156 64 128 64C100 64 80 82 80 112V128H144V168H80V224Z" /></svg>
      <div class="page-label">Cover</div>
    </div>
    <div class="label-bottom">
      Anyan Banking Agent<br>
      Design System 2026
    </div>
  </div>

  <div class="content-area">
    <div class="title-block">
      <h1 class="main-title">安言</h1>
      <p class="subtitle">
        安全可控的银行 AI 智能体<br>
        自然语言交互与确定的资金执行同时成立
      </p>
    </div>

    <p class="disclaimer">
      本作品为竞赛演示系统。所有账户、交易记录、OTP 验证码及后台服务均为虚构，仅用于展示安全分权架构的可行性。模型不持有账本写权限,所有资金操作由独立核心按三级权限执行。
    </p>
  </div>
</div>

</body>
</html>
