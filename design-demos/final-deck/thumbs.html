<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1344, height=1080">
<title>13 页缩略图对比</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1344px;
  min-height: 1080px;
  background: #F6F3EB;
  padding: 24px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

h1 {
  font-size: 32px;
  font-weight: 700;
  color: #30312D;
  margin-bottom: 32px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.thumb {
  border: 0.5px solid #30312D;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  position: relative;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.thumb-label {
  position: absolute;
  bottom: 8px;
  left: 8px;
  background: rgba(246, 243, 235, 0.95);
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 600;
  color: #30312D;
  border: 0.5px solid #30312D;
}
</style>
</head>
<body>

<h1>安言答辩 Deck — 瑞士网格方向（13 页）</h1>

<div class="grid">
  <div class="thumb">
    <img src="slides/01-cover.png" alt="01 封面">
    <div class="thumb-label">01 封面</div>
  </div>
  <div class="thumb">
    <img src="slides/02-nav.png" alt="02 导航">
    <div class="thumb-label">02 导航</div>
  </div>
  <div class="thumb">
    <img src="slides/03-problem.png" alt="03 信任缺口">
    <div class="thumb-label">03 信任缺口</div>
  </div>
  <div class="thumb">
    <img src="slides/04-capability.png" alt="04 能力总览">
    <div class="thumb-label">04 能力总览</div>
  </div>
  <div class="thumb">
    <img src="slides/05-arch.png" alt="05 分权架构">
    <div class="thumb-label">05 分权架构</div>
  </div>
  <div class="thumb">
    <img src="slides/06-evidence.png" alt="06 证据链">
    <div class="thumb-label">06 证据链</div>
  </div>
  <div class="thumb">
    <img src="slides/07-permission.png" alt="07 三级权限">
    <div class="thumb-label">07 三级权限</div>
  </div>
  <div class="thumb">
    <img src="slides/08-loop.png" alt="08 授权闭环">
    <div class="thumb-label">08 授权闭环</div>
  </div>
  <div class="thumb">
    <img src="slides/09-interface.png" alt="09 真实界面">
    <div class="thumb-label">09 真实界面</div>
  </div>
  <div class="thumb">
    <img src="slides/10-data.png" alt="10 测试数据">
    <div class="thumb-label">10 测试数据</div>
  </div>
  <div class="thumb">
    <img src="slides/11-limitations.png" alt="11 边界与风险">
    <div class="thumb-label">11 边界与风险</div>
  </div>
  <div class="thumb">
    <img src="slides/12-deliverables.png" alt="12 交付清单">
    <div class="thumb-label">12 交付清单</div>
  </div>
  <div class="thumb">
    <img src="slides/13-closing.png" alt="13 结尾">
    <div class="thumb-label">13 结尾</div>
  </div>
</div>

</body>
</html>
