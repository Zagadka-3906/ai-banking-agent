<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>安言 · 测试数据</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: linear-gradient(135deg, #2A2621 0%, #30312D 40%, #362F28 100%);
  font-family: 'Noto Sans SC', sans-serif;
  color: #F6F3EB;
  position: relative;
}

/* 竖排标题 */
.title-vertical {
  position: absolute;
  left: 100px;
  top: 180px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-family: 'Noto Serif SC', serif;
  font-size: 96px;
  font-weight: 900;
  letter-spacing: 0.12em;
  color: #F6F3EB;
  line-height: 1.15;
}

/* 竖排副标题 */
.subtitle-vertical {
  position: absolute;
  left: 240px;
  top: 180px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: #B39A68;
  line-height: 1.8;
}

/* 环盘容器 */
.mandala-container {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 680px;
  height: 680px;
}

.mandala-svg {
  width: 100%;
  height: 100%;
}

/* 引线标注 */
.annotation {
  position: absolute;
  font-family: 'Noto Sans SC', sans-serif;
}

.annotation-number {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 6px;
}

.annotation-dot {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #B39A68;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  font-weight: 600;
  color: #30312D;
  flex-shrink: 0;
}

.annotation-value {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 48px;
  font-weight: 600;
  color: #F6F3EB;
  line-height: 1;
}

.annotation-label {
  font-size: 20px;
  font-weight: 400;
  color: #B39A68;
  margin-left: 44px;
  line-height: 1.4;
}

.annotation-sublabel {
  font-size: 16px;
  font-weight: 400;
  color: rgba(246, 243, 235, 0.6);
  margin-left: 44px;
  margin-top: 2px;
}

/* 四个标注位置 */
.anno-1 { top: 80px; left: 1240px; }
.anno-2 { top: 380px; right: 100px; }
.anno-3 { bottom: 80px; left: 1240px; }
.anno-4 { top: 380px; left: 100px; }

/* Logo */
.logo {
  position: absolute;
  bottom: 60px;
  left: 100px;
  width: 40px;
  height: 40px;
  opacity: 0.75;
}

/* 底部说明 */
.footer-note {
  position: absolute;
  bottom: 65px;
  left: 160px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 24px;
  font-weight: 400;
  color: #B39A68;
  opacity: 0.8;
}
</style>
</head>
<body>

<!-- 竖排标题 -->
<div class="title-vertical">测试验证</div>

<!-- 竖排副标题 -->
<div class="subtitle-vertical">四层覆盖 / 3241 用例</div>

<!-- 环盘 -->
<div class="mandala-container">
  <svg class="mandala-svg" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="centerGlow" cx="50%" cy="50%">
        <stop offset="0%" style="stop-color:#B4472E;stop-opacity:0.3"/>
        <stop offset="100%" style="stop-color:#B4472E;stop-opacity:0"/>
      </radialGradient>
    </defs>

    <!-- 中心光晕 -->
    <circle cx="340" cy="340" r="320" fill="url(#centerGlow)" opacity="0.4"/>

    <!-- 外环：后端核心层 -->
    <g class="outer-ring">

      <circle cx="340" cy="340" r="260" fill="none" stroke="#B39A68" stroke-width="0.8" opacity="0.35"/>

            fill="#B39A68" opacity="0.15"/>

        后端核心

      <!-- 刻度线（16条） -->

        <line x1="340" y1="60" x2="340" y2="75" stroke="#B39A68" stroke-width="1.5" transform="rotate(22.5 340 340)"/>

        <line x1="340" y1="60" x2="340" y2="75" stroke="#B39A68" stroke-width="1.5" transform="rotate(157.5 340 340)"/>
        <line x1="340" y1="60" x2="340" y2="75" stroke="#B39A68" stroke-width="1.5" transform="rotate(180 340 340)"/>
        <line x1="340" y1="60" x2="340" y2="75" stroke="#B39A68" stroke-width="1.5" transform="rotate(202.5 340 340)"/>
        <line x1="340" y1="60" x2="340" y2="75" stroke="#B39A68" stroke-width="1.5" transform="rotate(225 340 340)"/>
        <line x1="340" y1="60" x2="340" y2="75" stroke="#B39A68" stroke-width="1.5" transform="rotate(247.5 340 340)"/>
        <line x1="340" y1="60" x2="340" y2="75" stroke="#B39A68" stroke-width="1.5" transform="rotate(270 340 340)"/>
        <line x1="340" y1="60" x2="340" y2="75" stroke="#B39A68" stroke-width="1.5" transform="rotate(292.5 340 340)"/>
        <line x1="340" y1="60" x2="340" y2="75" stroke="#B39A68" stroke-width="1.5" transform="rotate(315 340 340)"/>
        <line x1="340" y1="60" x2="340" y2="75" stroke="#B39A68" stroke-width="1.5" transform="rotate(337.5 340 340)"/>
      </g>
    </g>

    <!-- 中环2：Android JVM层 -->
    <g class="middle-ring-2">
      <circle cx="340" cy="340" r="200" fill="none" stroke="#B39A68" stroke-width="1.2" opacity="0.55"/>
      <circle cx="340" cy="340" r="180" fill="none" stroke="#B39A68" stroke-width="0.8" opacity="0.3"/>

      <!-- 扇区 -->
      <path d="M 340,140 A 200,200 0 0,1 540,340 A 200,200 0 0,1 340,540 A 200,200 0 0,1 140,340 A 200,200 0 0,1 340,140 Z"
            fill="#B39A68" opacity="0.12"/>

      <text text-anchor="middle" transform="translate(520,340) rotate(90)"
            font-family="Noto Serif SC, serif" font-size="18" font-weight="700" fill="#F6F3EB">
        Android JVM
      </text>
    </g>

    <!-- 中环3：设备专项层 -->
    <g class="middle-ring-3">
      <circle cx="340" cy="340" r="130" fill="none" stroke="#B39A68" stroke-width="1" opacity="0.5"/>
      <circle cx="340" cy="340" r="110" fill="none" stroke="#B39A68" stroke-width="0.8" opacity="0.28"/>

      <path d="M 340,210 A 130,130 0 1,1 339.9,210 Z"
            fill="#B39A68" opacity="0.1"/>

      <text text-anchor="middle" transform="translate(340,470) rotate(180)"
            font-family="Noto Serif SC, serif" font-size="16" font-weight="700" fill="#F6F3EB">
        设备专项
      </text>
    </g>

    <!-- 内环：收尾演示 -->
    <g class="inner-ring">
      <circle cx="340" cy="340" r="70" fill="none" stroke="#B39A68" stroke-width="0.8" opacity="0.45"/>

      <text text-anchor="middle" x="340" y="320"
            font-family="Noto Sans SC" font-size="14" font-weight="500" fill="#B39A68">
        收尾演示
      </text>

      <!-- 小圆装饰 -->
      <circle cx="340" cy="270" r="4" fill="#B39A68" opacity="0.5"/>
      <circle cx="390" cy="300" r="4" fill="#B39A68" opacity="0.5"/>
      <circle cx="410" cy="340" r="4" fill="#B39A68" opacity="0.5"/>
      <circle cx="390" cy="380" r="4" fill="#B39A68" opacity="0.5"/>
      <circle cx="340" cy="410" r="4" fill="#B39A68" opacity="0.5"/>
      <circle cx="290" cy="380" r="4" fill="#B39A68" opacity="0.5"/>
      <circle cx="270" cy="340" r="4" fill="#B39A68" opacity="0.5"/>
      <circle cx="290" cy="300" r="4" fill="#B39A68" opacity="0.5"/>
    </g>

    <!-- 中心点 -->
    <circle cx="340" cy="340" r="16" fill="#B4472E" opacity="0.85"/>
    <circle cx="340" cy="340" r="10" fill="#B4472E"/>
    <circle cx="340" cy="340" r="3" fill="#F6F3EB"/>

    <!-- 引线 -->
    <!-- 引线1：右上 → 后端核心 -->
    <path d="M 500,120 L 560,80 L 640,80" fill="none" stroke="#B39A68" stroke-width="1.2" opacity="0.7"/>
    <circle cx="500" cy="120" r="5" fill="#B39A68" opacity="0.8"/>

    <!-- 引线2：右 → Android JVM -->
    <path d="M 520,340 L 580,340 L 640,340" fill="none" stroke="#B39A68" stroke-width="1.2" opacity="0.7"/>
    <circle cx="520" cy="340" r="5" fill="#B39A68" opacity="0.8"/>

    <!-- 引线3：右下 → 设备专项 -->
    <path d="M 460,470 L 560,570 L 640,570" fill="none" stroke="#B39A68" stroke-width="1.2" opacity="0.7"/>
    <circle cx="460" cy="470" r="5" fill="#B39A68" opacity="0.8"/>

    <!-- 引线4：左 → 收尾演示 -->
    <path d="M 270,340 L 200,340 L 120,340" fill="none" stroke="#B39A68" stroke-width="1.2" opacity="0.7"/>
    <circle cx="270" cy="340" r="5" fill="#B39A68" opacity="0.8"/>
  </svg>
</div>

<!-- 标注1：后端核心 -->
<div class="annotation anno-1">
  <div class="annotation-number">
    <div class="annotation-dot">1</div>
    <div class="annotation-value">3101</div>
  </div>
  <div class="annotation-label">后端核心测试</div>
  <div class="annotation-sublabel">Spring Boot / JUnit 5</div>
</div>

<!-- 标注2：Android JVM -->
<div class="annotation anno-2">
  <div class="annotation-number">
    <div class="annotation-dot">2</div>
    <div class="annotation-value">115</div>
  </div>
  <div class="annotation-label">Android JVM 测试</div>
  <div class="annotation-sublabel">Robolectric / 合约验证</div>
</div>

<!-- 标注3：设备专项 -->

    <div class="annotation-dot">3</div>

  </div>
  <div class="annotation-label">设备专项测试</div>

</div>

<!-- 标注4：收尾演示 -->

    <div class="annotation-dot">4</div>

  </div>
  <div class="annotation-label">端到端演示</div>
  <div class="annotation-sublabel">完整流程验证</div>
</div>

</body>
</html>
