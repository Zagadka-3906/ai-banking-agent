[versions]
commonmark = "0.30.0"
# Pinned together on purpose: AGP 8.7.x requires Gradle 8.9+ and JDK 17 (see
# tools/install-android-toolchain.ps1), and the Compose compiler plugin version
# must match the Kotlin version exactly.
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
composeShimmer = "1.3.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
biometric = "1.1.0"
coroutines = "1.9.0"
mlkitText = "16.0.1"
# Instrumented UI tests (run on a device/emulator via connectedDebugAndroidTest).
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
junit = "4.13.2"
# Push notifications.  The BoM keeps firebase-messaging and its transitive
# play-services artifacts on one compatible release.
firebaseBom = "34.19.0"

[libraries]
commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-shimmer = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version.ref = "composeShimmer" }

androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Compose UI testing.  The Chinese instructions this app takes cannot be typed
# through `adb shell input text` (ASCII only), so the UI is driven by an
# instrumented test instead of by the shell.
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
# GrantPermissionRule: the app asks for POST_NOTIFICATIONS on launch, and the
# resulting system dialog would otherwise cover the login screen a UI test needs.
androidx-test-rules = { group = "androidx.test", name = "rules", version = "1.6.1" }
junit4 = { group = "junit", name = "junit", version.ref = "junit" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitText" }

# Push.  The BoM keeps firebase-messaging and its transitive play-services
# artifacts on one compatible release.  The google-services plugin is declared
# below and applied conditionally by :app: it needs a real google-services.json
# at configuration time, so a checkout without a Firebase project must not apply
# it (see plugins.google-services and app/build.gradle.kts).
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Applied conditionally by :app, and only when android/app/google-services.json
# exists - the plugin hard-fails configuration without that file.
google-services = { id = "com.google.gms.google-services", version = "4.5.0" }
